<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WB monogram logo">
  <defs>
    <clipPath id="wbClip">
      <text x="600" y="440" text-anchor="middle"
            font-family="'Arial Rounded MT Bold','Nunito',sans-serif"
            font-weight="900" font-size="440" letter-spacing="-26">WB</text>
    </clipPath>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28345A"/>
      <stop offset="1" stop-color="#1C2642"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB417"/>
      <stop offset="1" stop-color="#F59A12"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#wbClip)">
    <!-- navy base across whole monogram -->
    <rect x="0" y="0" width="1200" height="600" fill="url(#navy)"/>
    <!-- amber wedge over the B's stem / the W-B junction -->
    <polygon points="610,20 770,20 700,580 540,580" fill="url(#amber)"/>
  </g>
</svg>
