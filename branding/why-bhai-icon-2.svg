<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Bhai? channel icon — speech bubble with question mark">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEEDC"/>
      <stop offset="1" stop-color="#FFD2AE"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FA7A4C"/>
      <stop offset="1" stop-color="#E64E2A"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#FFE3CC"/>
    </linearGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <!-- shared question-mark shape -->
    <text id="qm" x="500" y="620" text-anchor="middle"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="360">?</text>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1000" height="1000" rx="220" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1000" height="1000" rx="220" fill="url(#glow2)"/>

  <!-- bubble drop shadow -->
  <g filter="url(#soft2)" opacity="0.3">
    <path d="M262 236 h476 a118 118 0 0 1 118 118 v300 a118 118 0 0 1 -118 118 h-262 l-150 128 l34 -128 h-98 a118 118 0 0 1 -118 -118 v-300 a118 118 0 0 1 118 -118 z" fill="#9c3418"/>
  </g>

  <!-- speech bubble -->
  <path d="M262 226 h476 a118 118 0 0 1 118 118 v300 a118 118 0 0 1 -118 118 h-262 l-150 128 l34 -128 h-98 a118 118 0 0 1 -118 -118 v-300 a118 118 0 0 1 118 -118 z" fill="url(#bubble)"/>

  <!-- question mark: 3D extrude -->
  <g fill="#B63C22">
    <use href="#qm" transform="translate(12,20)"/>
    <use href="#qm" transform="translate(10.5,17.5)"/>
    <use href="#qm" transform="translate(9,15)"/>
    <use href="#qm" transform="translate(7.5,12.5)"/>
    <use href="#qm" transform="translate(6,10)"/>
    <use href="#qm" transform="translate(4.5,7.5)"/>
    <use href="#qm" transform="translate(3,5)"/>
    <use href="#qm" transform="translate(1.5,2.5)"/>
  </g>
  <!-- top face -->
  <use href="#qm" fill="url(#q)"/>
</svg>
