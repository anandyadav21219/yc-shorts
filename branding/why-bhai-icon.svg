<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Bhai? channel icon — WB monogram">
  <defs>
    <!-- warm studio gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A63"/>
      <stop offset="0.55" stop-color="#F4683F"/>
      <stop offset="1" stop-color="#E4542F"/>
    </linearGradient>
    <!-- soft top light -->
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFC79B" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FFC79B" stop-opacity="0"/>
    </radialGradient>
    <!-- cream top face with subtle dimension -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#FFE3CC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- shared monogram shape: "WB" with a small "?" accent -->
    <text id="wb" x="498" y="640" text-anchor="middle"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="360" letter-spacing="-18">WB<tspan
          font-size="210" dy="-150">?</tspan></text>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1000" height="1000" rx="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="1000" rx="220" fill="url(#glow)"/>

  <!-- contact shadow -->
  <ellipse cx="512" cy="788" rx="250" ry="40" fill="#8f2f16" opacity="0.28" filter="url(#soft)"/>

  <!-- 3D extrude body (stacked darker copies) -->
  <g fill="#C14328">
    <use href="#wb" transform="translate(15,24)"/>
    <use href="#wb" transform="translate(13.5,21.6)"/>
    <use href="#wb" transform="translate(12,19.2)"/>
    <use href="#wb" transform="translate(10.5,16.8)"/>
    <use href="#wb" transform="translate(9,14.4)"/>
    <use href="#wb" transform="translate(7.5,12)"/>
    <use href="#wb" transform="translate(6,9.6)"/>
    <use href="#wb" transform="translate(4.5,7.2)"/>
    <use href="#wb" transform="translate(3,4.8)"/>
    <use href="#wb" transform="translate(1.5,2.4)"/>
  </g>

  <!-- top face -->
  <use href="#wb" fill="url(#face)"/>
</svg>
